# Builds the wiki in docs/wiki and publishes it with GitHub Pages
name: Wiki

on:
  push:
    branches: [master, remake/26.3]
    paths:
      - 'docs/wiki/**'
      - 'tools/wiki/**'
      - 'core/src/main/resources/data/sgcraft/recipe/**'
      - 'core/src/main/resources/assets/sgcraft/textures/font/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits rather than cancels one under way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install Pillow
      - run: python tools/wiki/build.py --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wiki

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
