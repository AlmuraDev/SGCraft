plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
repositories {
    // Strata's snapshots, until Strata 0.1.0 is released
    maven {
        name = 'CentralSnapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroup('org.inspirenxe')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = uri('https://maven.terraformersmc.com/releases')
            }
        }
        filter {
            includeGroup('com.terraformersmc')
        }
    }
}
dependencies {
    // Strata, for the optional MalisisCore-style screens core draws; never bundled, and only reached when Strata is installed
    compileOnly("org.inspirenxe:strata-api:${strata_version}")
    // Its core and SPI too, which the screen SGCraft hosts Strata screens in extends
    compileOnly("org.inspirenxe:strata-spi:${strata_version}")
    compileOnly("org.inspirenxe:strata-core:${strata_version}")
    compileOnly("org.inspirenxe:strata-minecraft-neoforge:${strata_version}") {
        transitive = false
        // Published for NeoForge, but written against vanilla classes alone, so core and Fabric compile against it too
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'neoforge')
        }
    }
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // Team Reborn Energy, the energy Fabric's tech mods share, so cables can charge power units; bundled in the jar
    implementation("teamreborn:energy:${tr_energy_version}")
    include("teamreborn:energy:${tr_energy_version}")
    // Mod Menu's Config button opens the settings screen; SGCraft runs without it
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") {
        transitive = false
    }
}

loom {
    def aw = project(':core').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
