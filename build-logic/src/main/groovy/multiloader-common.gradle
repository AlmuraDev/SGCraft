plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.licenser'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

// Every source file carries the MIT header; `gradlew updateLicenses` adds it, `gradlew check` fails without it.
// Files that carry on gcewing's work carry his copyright too: list each one here as it is ported.
def gcewingFiles = [
        '**/com/almuradev/sgcraft/mod/gate/ChevronOrder.java',
        '**/com/almuradev/sgcraft/mod/gate/DialStyle.java',
        '**/com/almuradev/sgcraft/mod/gate/EventHorizon.java',
        '**/com/almuradev/sgcraft/mod/gate/GateFormation.java',
        '**/com/almuradev/sgcraft/mod/gate/GateFrame.java',
        '**/com/almuradev/sgcraft/mod/gate/GateShape.java',
        '**/com/almuradev/sgcraft/mod/gate/GateTravel.java',
        '**/com/almuradev/sgcraft/mod/gate/SGConnection.java',
        '**/com/almuradev/sgcraft/mod/client/gate/IrisRenderer.java',
        '**/com/almuradev/sgcraft/mod/gate/GateBaseMenu.java',
        '**/com/almuradev/sgcraft/mod/client/gate/GateAddressPanel.java',
        '**/com/almuradev/sgcraft/mod/client/gate/GateAddressScreen.java',
        '**/com/almuradev/sgcraft/mod/client/gate/GateBaseScreen.java',
        '**/com/almuradev/sgcraft/mod/worldgen/StargatePiece.java',
        '**/com/almuradev/sgcraft/mod/worldgen/StructureGates.java',
        '**/com/almuradev/sgcraft/mod/worldgen/NaquadahOre.java',
        '**/com/almuradev/sgcraft/mod/worldgen/NaquadahOreFeature.java',
        '**/com/almuradev/sgcraft/mod/worldgen/NaquadahOreSettings.java',
        '**/com/almuradev/sgcraft/mod/worldgen/OreChunks.java',
]
license {
    header = rootProject.file('HEADER.txt')
    include '**/*.java'
    gcewingFiles.each { pattern ->
        // The licenser keeps what the closure returns, so it returns the properties it set
        matching(pattern) { properties ->
            properties.header = rootProject.file('HEADER-gcewing.txt')
            properties
        }
    }
}
