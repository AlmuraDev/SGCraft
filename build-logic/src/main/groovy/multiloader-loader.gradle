plugins {
    id 'multiloader-common'
}

// Each loader compiles the api and common sources into its own jar, so the mod is one jar per loader
def sharedProjects = [':api', ':common']

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
    sharedProjects.each { path ->
        compileOnly(project(path)) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
        commonJava(project(path: path, configuration: 'commonJava'))
        commonResources(project(path: path, configuration: 'commonResources'))
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
