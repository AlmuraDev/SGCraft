plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    maven {
        name = 'NeoForged'
        url = uri('https://maven.neoforged.net/releases')
    }
}

dependencies {
    // Checks and adds the licence header (HEADER.txt) on every source file
    implementation 'net.neoforged.licenser:net.neoforged.licenser.gradle.plugin:0.7.5'
}
