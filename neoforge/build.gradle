plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':core').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        // Saves every item's icon as the game draws it, and pictures of entities and gates, for the wiki:
        // "./gradlew :neoforge:runIconExport". It needs GUI scale 4, so its window is large enough for that
        iconExport {
            client()
            gameDirectory = this.mkdir(this.file('runs/icons'))
            systemProperty('sgcraft.exportIcons', rootProject.file('build/icons').absolutePath)
            programArguments.addAll '--width', '1600', '--height', '1200'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/gametest'))
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

repositories {
    // Strata's snapshots, until Strata 0.1.0 is released
    maven {
        name = 'CentralSnapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroup('org.inspirenxe')
        }
    }
}

dependencies {
    // Strata, for the optional MalisisCore-style screens core draws, bundled with Jar-in-Jar so they work anywhere.
    // NeoForge loads one copy of a mod id however many it finds (in mods, nested in other jars, or on a dev
    // client's classpath, as Almura's), the newest, so a client that has Strata already doesn't load it twice
    jarJar("org.inspirenxe:strata-minecraft-neoforge:${strata_version}") {
        transitive = false
    }
    compileOnly("org.inspirenxe:strata-api:${strata_version}")
    // Its core and SPI too, which the screen SGCraft hosts Strata screens in extends
    compileOnly("org.inspirenxe:strata-spi:${strata_version}")
    compileOnly("org.inspirenxe:strata-core:${strata_version}")
    compileOnly("org.inspirenxe:strata-minecraft-neoforge:${strata_version}") {
        transitive = false
        // Published for NeoForge, but written against vanilla classes alone, so core and Fabric compile against it too
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'neoforge')
        }
    }
}
